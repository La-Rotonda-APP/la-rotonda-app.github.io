<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Rotonda · Administración</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3B4331">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Rotonda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ac:#A8834A;--ac2:#D9BF8C;--ol:#3B4331;--ol2:#5B6648;--ink:#1F231A;--mut:#6B7280;--ln:#E7E5DF;--bg:#F6F4EF;--ok:#3F7D4E;--warn:#B7791F;--bad:#B4442F}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
button{font-family:inherit}
a{color:var(--ol)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lbox{background:#fff;border-radius:18px;padding:30px 28px;width:100%;max-width:380px;box-shadow:0 10px 40px #0001;text-align:center}
.lbox img{width:200px;margin-bottom:14px}
.lbox .f{text-align:left}
/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.nav{background:var(--ol);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.nav .brand{background:#fff;border-radius:12px;padding:10px;margin-bottom:16px;text-align:center}
.nav .brand img{width:150px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#E9E6DC;padding:9px 12px;border-radius:10px;font-size:13px;cursor:pointer;text-align:left}
.nav button:hover{background:#ffffff14}
.nav button.on{background:var(--ac);color:#fff}
.nav .ic{width:18px;text-align:center;opacity:.9}
.nav .me{margin-top:auto;font-size:11px;color:#C9C6BA;padding:12px 10px 0;border-top:1px solid #ffffff22}
.nav .me b{color:#fff;display:block;font-weight:500}
main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:18px;font-weight:600}
.top .st{font-size:11px;color:var(--mut)}
#view{padding:20px 24px 60px}
/* components */
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;background:#ECE9E1;color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--ac);color:#fff}.btn.dark{background:var(--ol);color:#fff}.btn.bad{background:#F6E3DE;color:var(--bad)}
.btn.wa{background:#25D366;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.kpi label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpi .v{font-size:18px;font-weight:600;margin-top:4px;white-space:nowrap}
.kpi.dk{background:var(--ol);color:#fff;border-color:var(--ol)}.kpi.dk label{color:var(--ac2)}
.kpi small{color:var(--mut);font-size:11px}
input,select,textarea{width:100%;border:1px solid #D6D3CB;border-radius:9px;padding:8px 10px;font:13px Poppins,sans-serif;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #E7D7B4;border-color:var(--ac)}
input[type=checkbox]{width:auto}
.f label{display:block;font-size:11px;color:var(--mut);margin:0 0 3px}
.fg{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}
.fg .w2{grid-column:span 2}.fg .wf{grid-column:1/-1}
.sec{font-size:10px;letter-spacing:1.5px;color:var(--ac);font-weight:600;margin:14px 0 8px;text-transform:uppercase}
table.l{width:100%;border-collapse:collapse;font-size:12.5px}
table.l th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}
table.l td{padding:8px;border-bottom:1px solid #F0EEE8;vertical-align:middle}
table.l tr:hover td{background:#FBFAF7}
table.l .r{text-align:right}
table.l .acts{white-space:nowrap;text-align:right}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500;background:#EEE;color:#555}
.b-ok{background:#E3F0E6;color:var(--ok)}.b-warn{background:#FBF0D9;color:var(--warn)}.b-bad{background:#F6E3DE;color:var(--bad)}.b-ac{background:#F4ECDD;color:#7A5C2E}
.muted{color:var(--mut)}.red{color:var(--bad)}.green{color:var(--ok)}
.empty{color:var(--mut);padding:18px;text-align:center}
.tabs{display:inline-flex;gap:4px;background:#ECE9E1;border-radius:10px;padding:3px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:12.5px;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0001}
.info{background:#F7F3EA;border:1px solid #E7D7B4;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:10px}
.line{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:8px;align-items:end;margin-bottom:8px}
.line .chk{font-size:11px;color:var(--mut);display:flex;gap:4px;align-items:center;padding-bottom:9px;white-space:nowrap}
.xb{border:0;background:none;color:#A8A29E;font-size:18px;cursor:pointer;padding:0 4px 6px}
.bars{display:flex;gap:14px;align-items:flex-end;height:150px;padding-top:10px}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:120px}
.bars .pair div{width:14px;border-radius:4px 4px 0 0}
.bars small{font-size:10px;color:var(--mut)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);text-align:center;padding:4px}
.cal .d{background:#fff;border:1px solid var(--ln);border-radius:8px;min-height:88px;padding:4px 5px;cursor:pointer;font-size:11px;overflow:hidden}
.cal .d.o{background:transparent;border-color:transparent;cursor:default}
.cal .d.t{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.cal .d .n{font-weight:600;font-size:11px;color:var(--mut)}
.cal .ev{background:#F4ECDD;color:#5A4320;border-radius:5px;padding:2px 4px;margin-top:3px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.s{background:#ECEFE6;color:var(--ol)}
/* modal */
.modal{position:fixed;inset:0;background:#1F231A80;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:760px;box-shadow:0 20px 60px #0003}
.mbox.wide{max-width:980px}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--ln)}
.mhead b{font-size:15px;font-weight:600}
.mhead button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut)}
.mbody{padding:16px 18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--ln);position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}
.pv{background:#E9E6DE;border-radius:10px;padding:12px;overflow:hidden;display:flex;justify-content:center}
.pv .sc{transform-origin:top left}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ol);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;display:none;max-width:90vw}
#toast.err{background:var(--bad)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--ac);z-index:100;display:none;animation:bz 1s infinite}
@keyframes bz{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
/* ===== DOCUMENT ===== */
.doc{width:816px;background:#fff;color:#1F231A;font-family:Poppins,sans-serif;font-size:11px;padding:44px 52px 34px;position:relative}
.doc.page{height:1056px;overflow:hidden}
.doc .d-top{display:flex;justify-content:space-between;align-items:flex-start}
.doc .d-logo{height:92px}
.doc .d-org{text-align:right;font-size:10px;color:#6B7280;line-height:1.65}.doc .d-org b{color:#1F231A;font-weight:600;font-size:11px}
.doc .d-lbl{font-size:9px;letter-spacing:2.5px;color:#6B7280;font-weight:600;text-transform:uppercase}
.doc .d-id{display:flex;justify-content:space-between;gap:20px;padding-bottom:12px;border-bottom:1.5px solid #A8834A}
.doc .d-num{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:700;color:#3B4331;letter-spacing:.5px;margin-top:2px}
.doc .d-sub{font-size:12px;color:#374151}
.doc .d-kv{display:grid;grid-template-columns:96px 210px;row-gap:5px;font-size:10.5px;align-self:end}
.doc .d-kv span{color:#9CA3AF}.doc .d-kv b{font-weight:600}
.doc .d-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.doc .d-amt{background:#3B4331;color:#fff;border-radius:8px;padding:18px}
.doc .d-amt .d-lbl{color:#D9BF8C}.doc .d-amt .v{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:700;margin:4px 0 6px}.doc .d-amt .m{font-size:9.5px;color:#D1D5DB}
.doc .d-pay{border:1px solid #E7E5DF;border-radius:8px;padding:14px 16px}
.doc .d-pay .d-kv{grid-template-columns:110px 1fr;margin-top:8px}
.doc .d-minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.doc .d-mini{border:1px solid #E7E5DF;border-radius:8px;padding:10px 12px}
.doc .d-mini .v{font-size:15px;font-weight:600;margin-top:3px}
.doc .d-mini.dk{background:#3B4331;color:#fff;border-color:#3B4331}.doc .d-mini.dk .d-lbl{color:#D9BF8C}
.doc .d-h{margin-top:20px}
.doc .d-tbl{border:1px solid #E7E5DF;border-radius:8px;margin-top:8px;overflow:hidden}
.doc .d-tbl table{width:100%;border-collapse:collapse;font-size:10.5px}
.doc .d-tbl th{font-size:8.5px;letter-spacing:1.8px;color:#6B7280;font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid #E7E5DF;text-transform:uppercase}
.doc .d-tbl td{padding:7px 12px;border-bottom:1px solid #EFEDE8}
.doc .d-tbl .r{text-align:right;white-space:nowrap}
.doc .d-tbl tr.tot td{border-top:1.5px solid #A8834A;border-bottom:0;font-weight:700;font-size:11px}
.doc .d-son{margin-top:8px;font-size:10.5px}.doc .d-son span{color:#9CA3AF}.doc .d-son b{font-weight:600}
.doc .d-note{margin-top:10px;display:inline-block;background:#F7F3EA;border:1px solid #E3D3B1;color:#6B5128;border-radius:6px;padding:6px 10px;font-size:10.5px}
.doc .d-body{font-size:12px;line-height:1.75;margin-top:22px;white-space:pre-wrap}
.doc .d-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:36px;gap:30px}
.doc .d-legal{font-size:9.5px;color:#9CA3AF;line-height:1.6;max-width:330px}
.doc .d-sg{position:relative;width:230px}
.doc .d-sg .im{height:48px;display:flex;align-items:flex-end}.doc .d-sg .im img{max-height:48px;max-width:170px}
.doc .d-sg .ln{border-top:1px solid #3B4331;padding-top:3px;width:190px}
.doc .d-sg .ln b{font-size:10.5px;font-weight:600;display:block}.doc .d-sg .ln span{font-size:9.5px;color:#9CA3AF}
.doc .d-sg .stamp{position:absolute;right:0;bottom:-8px;max-width:90px;max-height:90px;opacity:.9}
.doc .d-foot{border-top:1px solid #E7E5DF;padding-top:8px;display:flex;justify-content:space-between;font-size:8.5px;color:#9CA3AF;margin-top:30px}
.doc.page .d-foot{position:absolute;left:52px;right:52px;bottom:28px;margin:0}
.doc .d-foot b{color:#374151;font-weight:600}
#printArea{display:none}
@media print{
  @page{size:letter;margin:0}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body.printing{background:#fff}
  .pbreak{page-break-after:always;break-after:page}
}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .nav{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:10;gap:4px}
  .nav .brand,.nav .me{display:none}
  #navBtns{display:flex;gap:4px}
  .nav button{width:auto;flex:none;padding:8px 10px;font-size:12px}
  .kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:15px}
  .top{position:static;padding:12px 16px}
  #view{padding:14px 12px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .line{grid-template-columns:1fr 1fr}
  .line .c{grid-column:1/-1}
  .fg .w2{grid-column:auto}
}
</style>
</head>

function words(num){
  const U=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
  const D=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const C=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
  const h=x=>{if(!x)return"";if(x===100)return"cien";const c=Math.floor(x/100),r=x%100;let s=C[c];if(r)s+=(s?" ":"")+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?" y "+U[r%10]:""));return s};
  const g=x=>{if(x===0)return"cero";const mm=Math.floor(x/1e6),th=Math.floor((x%1e6)/1000),rest=x%1000,p=[];
    if(mm)p.push(mm===1?"un millón":g(mm).replace(/veintiuno$/,"veintiún").replace(/uno$/,"un")+" millones");
    if(th)p.push(th===1?"mil":h(th).replace(/veintiuno$/,"veintiún").replace(/uno$/,"un")+" mil");
    if(rest)p.push(h(rest));return p.join(" ")};
  return g(num)}
function amountWords(v,cur){v=Math.round((+v||0)*100);const e=Math.floor(v/100),c=v%100;
  let w=words(e).replace(/veintiuno$/,"veintiún").replace(/uno$/,"un");if(/(millón|millones)$/.test(w))w+=" de";
  w=w.charAt(0).toUpperCase()+w.slice(1);
  const nm=cur==="US$"?(e===1?"dólar estadounidense":"dólares estadounidenses"):(e===1?"peso dominicano":"pesos dominicanos");
  return `${w} ${nm} con ${String(c).padStart(2,"0")}/100`}

let DB=null,ME=null;
const TMAP={Casas:"casas",Cargos:"cargos",Ingresos:"ingresos",Gastos:"gastos",Empleados:"empleados",EmpEventos:"emp_eventos",Mantenimiento:"mantenimiento",Comunicaciones:"comunicaciones",Reservas:"reservas",Incidencias:"incidencias"};
const TABLES=Object.keys(TMAP);
const NULLABLE=new Set(["fecha","fpago","vence","ingreso","fecha_fin","proxima","cierre","total","balance","subtotal","itbis","cuota","monto","salario","costo","deposito","personas","factura_id","empleado_id","mantenimiento_id"]);

function trErr(e){const m=String(e&&(e.message||e.error_description||e.msg)||e||"Error");
  if(/Invalid login/i.test(m))return "Usuario o clave incorrectos.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Sin conexión con el servidor.";
  if(/row-level security|permission denied/i.test(m))return "No tienes permiso para esta acción.";
  if(/duplicate key/i.test(m))return "Ya existe un registro con ese dato.";
  return m}
function normRow(r){const o={};for(const k in r){let v=r[k];if(v===null||v===undefined)v="";if((k==="desde"||k==="hasta")&&typeof v==="string")v=v.slice(0,5);o[k]=v}return o}
function cleanRow(r){const o={};for(const k in r){let v=r[k];if(v===undefined)continue;if(k==="id"&&!v)continue;if(NULLABLE.has(k)&&(v===""||v===null))v=null;o[k]=v}delete o.usuario;delete o.ts;return o}
async function fetchAll(table){let out=[],from=0;for(;;){const {data,error}=await sb.from(table).select("*").range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
async function invokeFn(body){const {data,error}=await sb.functions.invoke("usuarios",{body});
  if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}throw new Error(m)}if(data&&data.error)throw new Error(data.error);return data}
const userRow=p=>({id:p.id,usuario:p.usuario,nombre:p.nombre,rol:p.rol,casa:p.casa||"",activo:p.activo?"Sí":"No"});
async function api(action,p={}){
  busy(true);
  try{
    switch(action){
      case "login":{const {data:{user}}=await sb.auth.getUser();if(!user)throw new Error("Sesión no válida.");
        const {data,error}=await sb.from("perfiles").select("*").eq("id",user.id).maybeSingle();if(error)throw error;
        if(!data)throw new Error("Tu usuario no tiene perfil asignado.");if(!data.activo)throw new Error("Tu usuario está desactivado.");return {user:userRow(data)}}
      case "load":{const d={};const tabs=Object.entries(TMAP);
        const res=await Promise.all(tabs.map(([k,t])=>fetchAll(t)));tabs.forEach(([k],i)=>d[k]=res[i].map(normRow));
        const {data:cfg,error:e1}=await sb.from("config").select("*");if(e1)throw e1;d.cfg={};cfg.forEach(r=>d.cfg[r.clave]=r.valor);
        if(ME&&ME.rol!=="propietario"){const {data:se}=await sb.from("series").select("*");(se||[]).forEach(r=>d.cfg["seq_"+r.prefijo]=String(r.siguiente))}
        if(ME&&ME.rol!=="propietario"&&ME.rol!=="operador"&&ME.rol!=="consulta"){const {data:us}=await sb.from("perfiles").select("*").order("usuario");d.Usuarios=(us||[]).map(userRow)}
        if(ME&&ME.rol==="propietario"){const {data:cp}=await sb.rpc("casas_publicas");const mine=new Set(d.Casas.map(c=>c.id));(cp||[]).forEach(c=>{if(!mine.has(c.id))d.Casas.push(normRow(Object.assign({telefono:"",email:"",notas:""},c)))});
          const {data:oc}=await sb.rpc("reservas_ocupadas");const own=new Set(d.Reservas.map(r=>r.id));
          (oc||[]).forEach(r=>{if(!own.has(r.id))d.Reservas.push(normRow(Object.assign({casa:"",evento:"",personas:"",deposito:"",notas:""},r)))})}
        return d}
      case "save":{const t=TMAP[p.table];if(!t)throw new Error("Tabla no válida");const row=cleanRow(p.row);let q;
        if(row.id){const id=row.id;delete row.id;q=sb.from(t).update(row).eq("id",id)}else q=sb.from(t).insert(row);
        const {data,error}=await q.select().single();if(error)throw error;return normRow(data)}
      case "remove":{const t=TMAP[p.table];
        if(p.table==="Ingresos"||p.table==="Gastos"){const {data,error}=await sb.from(t).update({anulado:"Sí"}).eq("id",p.id).select().single();if(error)throw error;return normRow(data)}
        const {error}=await sb.from(t).delete().eq("id",p.id);if(error)throw error;return {id:p.id,deleted:true}}
      case "bulk":{const t=TMAP[p.table];const rows=p.rows.map(cleanRow);for(let i=0;i<rows.length;i+=500){const {error}=await sb.from(t).insert(rows.slice(i,i+500));if(error)throw error}return {count:rows.length}}
      case "genCargos":{const {data,error}=await sb.rpc("gen_cargos",{p_desde:p.desde,p_hasta:p.hasta,p_concepto:p.concepto||"Cuota de mantenimiento",p_monto:p.monto===""||p.monto===undefined?null:+p.monto,p_dia:+p.dia||1,p_casas:p.casas&&p.casas.length?p.casas:null,p_nota:p.nota||null});
        if(error)throw error;return {count:data}}
      case "saveConfig":{const rows=[],seqs=[];for(const k in p.cfg){if(k.startsWith("seq_"))seqs.push({prefijo:k.slice(4),siguiente:Math.max(1,parseInt(p.cfg[k])||1)});else rows.push({clave:k,valor:String(p.cfg[k]??"")})}
        if(rows.length){const {error}=await sb.from("config").upsert(rows);if(error)throw error}
        for(const r of seqs){const {error}=await sb.from("series").update({siguiente:r.siguiente}).eq("prefijo",r.prefijo);if(error)throw error}
        const {data:cfg}=await sb.from("config").select("*");const o={};cfg.forEach(r=>o[r.clave]=r.valor);const {data:se}=await sb.from("series").select("*");(se||[]).forEach(r=>o["seq_"+r.prefijo]=String(r.siguiente));return o}
      case "saveUser":{const r=p.row;const out=await invokeFn({action:r.id?"editar":"crear",row:{id:r.id,usuario:r.usuario,nombre:r.nombre,clave:r.clave,rol:r.rol,casa:r.casa,activo:r.activo}});return userRow(out)}
      default:throw new Error("Acción no válida: "+action)}
  }catch(e){throw new Error(trErr(e))}finally{busy(false)}

  let cg=DB.Cargos.filter(c=>String(c.casa)===String(casa));

  const tc=cg.reduce((s,c)=>s+n(c.monto),0),tp=pg.reduce((s,i)=>s+ingAplica(i),0);
  let rem=tp;const pend=[];
  cg.forEach(c=>{const a=Math.min(rem,n(c.monto));rem=r2(rem-a);const p=r2(n(c.monto)-a);if(p>0.004)pend.push(Object.assign({},c,{pend:p}))});

/* ---------- PDF / imprimir / vista previa ---------- */
async function pdf(html,name){
  if(typeof html2pdf==="undefined"){printDoc(html);return}
  const box=document.createElement("div");box.style.cssText="position:fixed;left:0;top:0;width:816px;z-index:-1;background:#fff";
  const inner=document.createElement("div");inner.style.cssText="width:816px;background:#fff";inner.innerHTML=html;box.appendChild(inner);document.body.appendChild(box);busy(true);
  try{await (document.fonts?document.fonts.ready:0);const y=window.scrollY;window.scrollTo(0,0);
    await html2pdf().set({margin:0,filename:name.replace(/[^\w\-. ]+/g,"_")+".pdf",image:{type:"jpeg",quality:.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",scrollX:0,scrollY:0,x:0,y:0,width:816,windowWidth:816},
      jsPDF:{unit:"px",format:[816,1056],orientation:"portrait",hotfixes:["px_scaling"]},
      pagebreak:{mode:["css","legacy"],avoid:["tr",".avoid",".d-minis",".d-cards",".d-sign"]}}).from(inner).save();
    window.scrollTo(0,y);toast("PDF descargado")}
  catch(e){toast("No se pudo generar el PDF. Usa Imprimir.",1)}
  finally{box.remove();busy(false)}}
function printDoc(html){const pa=$("printArea");pa.innerHTML=html;document.body.classList.add("printing");
  setTimeout(()=>{window.print();setTimeout(()=>{document.body.classList.remove("printing");pa.innerHTML=""},500)},150)}
function showDoc(title,html,name,extra){
  openModal(title,`<div class="pv" id="pvw"><div class="sc" id="pvs">${html}</div></div>`,
    `${extra||""}<button class="btn" id="dPrint">Imprimir</button><button class="btn dark" id="dPdf">Descargar PDF</button>`,true);
  const fit=()=>{const w=$("pvw").clientWidth-24,s=Math.min(1,w/816),el=$("pvs");el.style.transform=`scale(${s})`;el.style.width="816px";
    el.style.height=(el.scrollHeight*s)+"px";$("pvw").style.height=(el.firstElementChild.scrollHeight*s+24)+"px"};
  setTimeout(fit,30);$("dPdf").onclick=()=>pdf(html,name);$("dPrint").onclick=()=>printDoc(html);}

function verIngreso(id){const i=DB.Ingresos.find(x=>x.id===id);const c=casaObj(i.casa)||{};
  const txt=`*${C().nombre}*\nRecibo ${i.no}\nCasa ${i.casa} · ${i.propietario}\nMonto: ${money(i.total,i.moneda)}\nFecha: ${fd(i.fecha)}\n${lineas(i).map(l=>"• "+l.c+(l.p?" "+fp(l.p):"")+": "+money(l.m,i.moneda)).join("\n")}\n¡Gracias por su pago!`;
  showDoc("Recibo "+i.no,docIngreso(i),`${i.no}_Casa${i.casa}`,c.telefono?`<a class="btn wa" target="_blank" href="${waLink(c.telefono,txt)}">WhatsApp</a>`:"")}
let FL=[];
function formIngreso(id,hist){
  const i=id?DB.Ingresos.find(x=>x.id===id):null;hist=hist||(i&&i.origen==="Histórico");
  const o=i||{fecha:today(),fpago:today(),moneda:CUR(),forma:"Transferencia",descripcion:"Cuota de mantenimiento"};
  FL=i?lineas(i).map(l=>({...l})):[{c:"Cuota de mantenimiento",p:thisP(),m:"",a:1}];
  openModal((i?"Editar ":"")+(hist?"Pago histórico":"Recibo de ingreso")+(i?" "+i.no:""),
  `${hist?`<div class="info">Registra pagos hechos antes de usar el sistema. Se numeran aparte (H-00001) o con el número del recibo original.</div>`:""}
  <div class="fg">${FS("Casa","f_casa",casaOpts("— Sin casa / otro ingreso —"),o.casa)}${F("Propietario / pagador","f_prop",o.propietario)}${F("Fecha de emisión","f_fecha",o.fecha,"date")}
   ${hist?F("No. recibo original (opcional)","f_no",o.no||""):""}</div>
  <div id="f_saldo"></div>
  <div class="fg">${F("Descripción","f_desc",o.descripcion,"text","","w2")}${FS("Moneda","f_mon",[["RD$","RD$ Pesos"],["US$","US$ Dólares"]],o.moneda)}</div>
  <div class="sec">Conceptos</div><datalist id="dl_con">${["Cuota de mantenimiento","Cuota extraordinaria","Recargo por mora","Fondo de reserva","Abono a cuenta"].concat(NOACCT).map(c=>`<option value="${c}">`).join("")}</datalist>
  <div id="f_lines"></div><button class="btn sm" id="f_add">+ Concepto</button> <button class="btn sm" id="f_pend">Cargar períodos pendientes</button>
  <div style="text-align:right;font-size:15px;margin-top:8px">Total: <b id="f_tot"></b></div>
  <div class="sec">Datos del pago</div>
  <div class="fg">${FS("Forma de pago","f_forma",FORMAS,o.forma)}${F("Fecha del pago","f_fpago",o.fpago||o.fecha,"date")}${F("Banco","f_banco",o.banco)}${F("Referencia","f_ref",o.referencia)}${F("Nota","f_nota",o.nota,"text","","wf")}</div>`,
  `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="f_save">${i?"Guardar cambios":"Guardar y ver recibo"}</button>`);
  const drawL=()=>{$("f_lines").innerHTML=FL.map((l,k)=>`<div class="line"><div class="f c"><label>Concepto</label><input list="dl_con" data-k="c" data-i="${k}" value="${esc(l.c)}"></div>
    <div class="f"><label>Período</label><input type="month" data-k="p" data-i="${k}" value="${esc(l.p)}"></div><div class="f"><label>Monto</label><input type="number" step="0.01" data-k="m" data-i="${k}" value="${esc(l.m)}"></div>
    <label class="chk" title="Si está marcado, el monto se abona a la cuenta de la casa"><input type="checkbox" data-k="a" data-i="${k}" ${String(l.a)!=="0"?"checked":""}>Abona</label><button class="xb" data-del="${k}">×</button></div>`).join("");tot()};
  const tot=()=>$("f_tot").textContent=money(FL.reduce((s,l)=>s+n(l.m),0),V("f_mon"));
  const showSaldo=()=>{const c=V("f_casa");if(!c){$("f_saldo").innerHTML="";return}const ct=cuenta(c);
    $("f_saldo").innerHTML=`<div class="info">Saldo actual de la casa ${esc(c)}: <b class="${ct.saldo>0?"red":"green"}">${money(ct.saldo)}</b>${ct.pend.length?` · Pendiente: ${ct.pend.map(p=>fps(p.periodo)+" "+money(p.pend)).join(", ")}`:""}${ct.favor?` · Saldo a favor ${money(ct.favor)}`:""}</div>`};
  $("f_lines").oninput=e=>{const t=e.target,k=t.dataset.k;if(!k)return;const L=FL[t.dataset.i];
    if(k==="a")L.a=t.checked?1:0;else{L[k]=t.value;if(k==="c"){const na=NOACCT.includes(t.value)?0:1;if(L.a!==na){L.a=na;t.closest(".line").querySelector("[data-k=a]").checked=!!na}}}tot()};
  $("f_lines").onchange=$("f_lines").oninput;
  $("f_lines").onclick=e=>{if(e.target.dataset.del!==undefined){FL.splice(+e.target.dataset.del,1);if(!FL.length)FL=[{c:"",p:thisP(),m:"",a:1}];drawL()}};
  $("f_add").onclick=()=>{FL.push({c:"Cuota de mantenimiento",p:FL.length?addM(FL[FL.length-1].p||thisP(),1):thisP(),m:(casaObj(V("f_casa"))||{}).cuota||"",a:1});drawL()};
  $("f_pend").onclick=()=>{const c=V("f_casa");if(!c)return toast("Elige una casa",1);const ct=cuenta(c);if(!ct.pend.length)return toast("La casa no tiene períodos pendientes");
    FL=ct.pend.map(p=>({c:p.concepto,p:p.periodo,m:p.pend,a:1}));drawL()};
  $("f_casa").onchange=()=>{const c=casaObj(V("f_casa"));if(c){$("f_prop").value=c.propietario||"";if(!i&&FL.length===1&&!FL[0].m){FL[0].m=c.cuota||"";drawL()}}showSaldo()};
  $("f_mon").onchange=tot;drawL();showSaldo();
  $("f_save").onclick=()=>wrap(async()=>{
    const L=FL.filter(l=>l.c&&n(l.m)).map(l=>({c:l.c,p:l.p,m:r2(n(l.m)),a:String(l.a)==="0"?0:1}));
    if(!L.length)throw new Error("Agrega al menos un concepto con monto.");
    if(!V("f_prop")&&!V("f_casa"))throw new Error("Indica la casa o el pagador.");
    const total=r2(L.reduce((s,l)=>s+l.m,0));
    const row={id:i?i.id:undefined,casa:V("f_casa"),propietario:V("f_prop"),fecha:V("f_fecha"),descripcion:V("f_desc"),moneda:V("f_mon"),total,lineas:L,forma:V("f_forma"),fpago:V("f_fpago"),banco:V("f_banco"),referencia:V("f_ref"),nota:V("f_nota"),origen:hist?"Histórico":"App",anulado:""};
    if(hist&&!i)row.no=V("f_no");
    if(row.casa){const ct=cuenta(row.casa);const prev=i?ingAplica(i):0;row.balance=r2(ct.saldo+prev-L.filter(l=>l.a).reduce((s,l)=>s+l.m,0))}else row.balance="";
    const s=await save("Ingresos",row);toast("Guardado "+s.no);render();closeModal();if(!hist||!i)verIngreso(s.id)})}
async function anular(t,id){if(!confirmBox("¿Anular este documento? Quedará registrado como anulado."))return;await wrap(async()=>{await remove(t,id);toast("Anulado");render()})}

ST.gas={tab:"pagos",q:"",m:"",an:false};
R.gastos=()=>{
  const s=ST.gas;const isF=s.tab==="facturas";
  let L=DB.Gastos.filter(g=>(isF?g.tipo==="Factura":g.tipo!=="Factura")&&(s.an||g.anulado!=="Sí")&&(!s.m||g.fecha.startsWith(s.m)));
  if(s.q){const q=s.q.toLowerCase();L=L.filter(g=>[g.no,g.beneficiario,g.descripcion,g.ncf,g.categoria].join(" ").toLowerCase().includes(q))}
  L.sort((a,b)=>(b.fecha+b.ts).localeCompare(a.fecha+a.ts));
  const tot=L.filter(g=>g.anulado!=="Sí").reduce((t,g)=>t+n(g.total),0);
  return `<div class="tabs"><button class="${!isF?"on":""}" onclick="ST.gas.tab='pagos';render()">Recibos de pago</button><button class="${isF?"on":""}" onclick="ST.gas.tab='facturas';render()">Facturas de compra</button></div>
  <div class="bar"><input id="gq" placeholder="Buscar…" style="max-width:260px" value="${esc(s.q)}"><input id="gm" type="month" style="max-width:170px" value="${s.m}">
   <label style="display:flex;gap:5px;align-items:center;font-size:12px;color:var(--mut)"><input type="checkbox" id="gan" ${s.an?"checked":""}>Ver anulados</label><span class="sp"></span>
   ${can.w()?(isF?`<button class="btn pri" onclick="formFactura()">+ Registrar factura</button>`:`<button class="btn pri" onclick="formPago()">+ Recibo de pago</button>`):""}</div>
  <div class="card"><div class="tw"><table class="l">${isF?
   `<tr><th>No.</th><th>Fecha</th><th>Proveedor</th><th>NCF</th><th>Categoría</th><th>Vence</th><th>Estado</th><th class="r">Total</th><th></th></tr>
   ${L.map(g=>`<tr><td><b>${esc(g.no)}</b> ${g.anulado==="Sí"?badge("Anulada","bad"):""}</td><td>${fd(g.fecha)}</td><td>${esc(g.beneficiario)}<br><span class="muted">${esc(g.descripcion)}</span></td><td>${esc(g.ncf)}</td><td>${esc(g.categoria)}</td><td>${fd(g.vence)}</td>
    <td>${g.estado==="Pagada"?badge("Pagada","ok"):badge("Pendiente",g.vence&&g.vence<today()?"bad":"warn")}</td><td class="r"><b>${money(g.total)}</b></td>
    <td class="acts">${g.adjunto?`<button class="btn sm" onclick="openAdj('${esc(g.adjunto)}')">Ver</button> `:""}${can.w()&&g.anulado!=="Sí"?`${g.estado!=="Pagada"?`<button class="btn sm dark" onclick="formPago(null,'${g.id}')">Pagar</button> `:""}<button class="btn sm" onclick="formFactura('${g.id}')">Editar</button>`:""}${can.a()&&g.anulado!=="Sí"?` <button class="btn sm bad" onclick="anular('Gastos','${g.id}')">Anular</button>`:""}</td></tr>`).join("")||`<tr><td colspan="9" class="empty">No hay facturas</td></tr>`}`
  :`<tr><th>No.</th><th>Fecha</th><th>Beneficiario</th><th>Categoría</th><th>Concepto</th><th>Forma</th><th class="r">Total</th><th></th></tr>
   ${L.map(g=>`<tr><td><b>${esc(g.no)}</b> ${g.tipo==="Nómina"?badge("Nómina","ac"):""} ${g.anulado==="Sí"?badge("Anulado","bad"):""}</td><td>${fd(g.fecha)}</td><td>${esc(g.beneficiario)}</td><td>${esc(g.categoria)}</td><td>${esc(g.descripcion||g.periodo)}</td><td>${esc(g.forma)}</td><td class="r"><b>${money(g.total)}</b></td>
    <td class="acts"><button class="btn sm" onclick="verGasto('${g.id}')">PDF</button>${can.w()&&g.anulado!=="Sí"&&g.tipo==="Pago"?` <button class="btn sm" onclick="formPago('${g.id}')">Editar</button>`:""}${can.a()&&g.anulado!=="Sí"?` <button class="btn sm bad" onclick="anular('Gastos','${g.id}')">Anular</button>`:""}</td></tr>`).join("")||`<tr><td colspan="8" class="empty">No hay recibos de pago</td></tr>`}`}
  </table></div><div style="text-align:right;margin-top:10px">Total: <b>${money(tot)}</b> · ${L.length} registro(s)</div></div>`};
A.gastos=()=>{$("gq").oninput=e=>{ST.gas.q=e.target.value;rerenderKeep("gq")};$("gm").onchange=e=>{ST.gas.m=e.target.value;render()};$("gan").onchange=e=>{ST.gas.an=e.target.checked;render()}};
function verGasto(id){const g=DB.Gastos.find(x=>x.id===id);if(g.tipo==="Nómina")showDoc("Nómina "+g.no,docNomina(g),`${g.no}_${g.beneficiario}`);else if(g.tipo==="Pago")showDoc("Recibo de pago "+g.no,docPago(g),`${g.no}_${g.beneficiario}`);else formFactura(id)}
function formPago(id,facId,pre){
  const g=id?DB.Gastos.find(x=>x.id===id):null;const fac=facId?DB.Gastos.find(x=>x.id===facId):null;
  const o=g||Object.assign({fecha:today(),forma:"Transferencia",categoria:fac?fac.categoria:"",beneficiario:fac?fac.beneficiario:"",rnc:fac?fac.rnc:"",descripcion:fac?`Pago factura ${fac.ncf||fac.no}`+(fac.descripcion?" · "+fac.descripcion:""):"",total:fac?fac.total:"",factura_id:facId||""},pre||{});
  const fpend=facturasPend().concat(fac&&!facturasPend().includes(fac)?[fac]:[]);
  openModal(g?"Editar recibo de pago "+g.no:"Recibo de pago",
  `<div class="fg">${F("Fecha","p_fecha",o.fecha,"date")}${F("Beneficiario","p_ben",o.beneficiario,"text","list='dl_ben'")}${F("RNC / Cédula","p_rnc",o.rnc)}${FS("Categoría","p_cat",[""].concat(list("categorias")),o.categoria)}</div>
   <datalist id="dl_ben">${[...new Set(DB.Gastos.map(x=>x.beneficiario).filter(Boolean))].map(b=>`<option value="${esc(b)}">`).join("")}</datalist>
   <div class="fg">${F("Concepto","p_desc",o.descripcion,"text","","w2")}${F("Monto","p_monto",o.total,"number","step='0.01'")}</div>
   <div class="fg">${FS("Factura relacionada (opcional)","p_fac",[["","— Ninguna —"]].concat(fpend.map(f=>[f.id,`${f.no} · ${f.beneficiario} · ${money(f.total)}`])),o.factura_id,"w2")}${FS("Forma de pago","p_forma",FORMAS,o.forma)}${F("Banco","p_banco",o.banco)}${F("Referencia","p_ref",o.referencia)}</div>`,
  `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="p_save">Guardar y ver recibo</button>`);
  $("p_fac").onchange=()=>{const f=DB.Gastos.find(x=>x.id===V("p_fac"));if(f){$("p_ben").value=f.beneficiario;$("p_rnc").value=f.rnc||"";$("p_cat").value=f.categoria||"";$("p_monto").value=f.total;$("p_desc").value=`Pago factura ${f.ncf||f.no}`+(f.descripcion?" · "+f.descripcion:"")}};
  $("p_save").onclick=()=>wrap(async()=>{
    if(!V("p_ben")||!n(V("p_monto")))throw new Error("Completa beneficiario y monto.");
    const row={id:g?g.id:undefined,tipo:"Pago",fecha:V("p_fecha"),beneficiario:V("p_ben"),rnc:V("p_rnc"),categoria:V("p_cat"),descripcion:V("p_desc"),subtotal:r2(n(V("p_monto"))),itbis:0,total:r2(n(V("p_monto"))),forma:V("p_forma"),banco:V("p_banco"),referencia:V("p_ref"),factura_id:V("p_fac"),anulado:""};
    const s=await save("Gastos",row);if(row.factura_id)putLocal("Gastos",{id:row.factura_id,estado:"Pagada"});toast("Guardado "+s.no);closeModal();render();verGasto(s.id)})}
function formFactura(id){
  const g=id?DB.Gastos.find(x=>x.id===id):null;const o=g||{fecha:today(),estado:"Pendiente"};
  openModal(g?"Factura "+g.no:"Registrar factura de compra",
  `<div class="fg">${F("Fecha factura","x_fecha",o.fecha,"date")}${F("Proveedor","x_ben",o.beneficiario,"text","list='dl_prov'")}${F("RNC","x_rnc",o.rnc)}${F("NCF","x_ncf",o.ncf)}</div>
   <datalist id="dl_prov">${[...new Set(DB.Gastos.filter(x=>x.tipo==="Factura").map(x=>x.beneficiario).filter(Boolean))].map(b=>`<option value="${esc(b)}">`).join("")}</datalist>
   <div class="fg">${FS("Categoría","x_cat",[""].concat(list("categorias")),o.categoria)}${F("Descripción","x_desc",o.descripcion,"text","","w2")}</div>
   <div class="fg">${F("Subtotal","x_sub",o.subtotal,"number","step='0.01'")}<div class="f"><label>ITBIS <a href="#" id="x_18" style="font-size:10px">(18%)</a></label><input id="x_itb" type="number" step="0.01" value="${esc(o.itbis)}"></div>${F("Total","x_tot",o.total,"number","step='0.01'")}${F("Vence","x_vence",o.vence,"date")}</div>
   <div class="fg">${FS("Estado","x_est",["Pendiente","Pagada"],o.estado)}<div class="f w2"><label>Copia de la factura (foto o PDF)</label><input type="file" id="x_file" accept="image/*,application/pdf">${o.adjunto?`<a href="#" onclick="openAdj('${esc(o.adjunto)}');return false" style="font-size:12px">Ver adjunto actual</a>`:""}</div></div>
   ${!g?`<label style="display:flex;gap:6px;align-items:center;font-size:12.5px"><input type="checkbox" id="x_pay"> Registrar el pago ahora y emitir recibo de pago</label>
   <div class="fg" id="x_payf" style="display:none;margin-top:8px">${FS("Forma de pago","x_forma",FORMAS,"Transferencia")}${F("Banco","x_banco","")}${F("Referencia","x_ref","")}${F("Fecha de pago","x_fpago",today(),"date")}</div>`:""}`,
  `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="x_save">Guardar</button>`);
  const calc=()=>{$("x_tot").value=r2(n(V("x_sub"))+n(V("x_itb")))||""};
  $("x_sub").oninput=calc;$("x_itb").oninput=calc;$("x_18").onclick=e=>{e.preventDefault();$("x_itb").value=r2(n(V("x_sub"))*.18);calc()};
  if($("x_pay"))$("x_pay").onchange=e=>{$("x_payf").style.display=e.target.checked?"grid":"none";$("x_est").value=e.target.checked?"Pagada":"Pendiente"};
  $("x_save").onclick=()=>wrap(async()=>{
    if(!V("x_ben")||!n(V("x_tot")))throw new Error("Completa proveedor y total.");
    let adj=o.adjunto||"";const fl=$("x_file").files[0];if(fl){toast("Subiendo archivo…");adj=await uploadFile(fl)}
    const pay=$("x_pay")&&$("x_pay").checked;
    const row={id:g?g.id:undefined,tipo:"Factura",fecha:V("x_fecha"),beneficiario:V("x_ben"),rnc:V("x_rnc"),ncf:V("x_ncf"),categoria:V("x_cat"),descripcion:V("x_desc"),subtotal:n(V("x_sub")),itbis:n(V("x_itb")),total:r2(n(V("x_tot"))),vence:V("x_vence"),estado:pay?"Pendiente":V("x_est"),adjunto:adj,anulado:""};
    const f=await save("Gastos",row);
    if(pay){const p=await save("Gastos",{tipo:"Pago",fecha:V("x_fpago"),beneficiario:f.beneficiario,rnc:f.rnc,categoria:f.categoria,descripcion:`Pago factura ${f.ncf||f.no}`+(f.descripcion?" · "+f.descripcion:""),subtotal:f.total,itbis:0,total:f.total,forma:V("x_forma"),banco:V("x_banco"),referencia:V("x_ref"),factura_id:f.id,anulado:""});
      putLocal("Gastos",{id:f.id,estado:"Pagada"});closeModal();render();verGasto(p.id)}
    else{toast("Factura guardada "+f.no);closeModal();render()}})}

   ${DB.Casas.map(c=>{const ct=cuenta(c.casa);return `<tr><td><b>${esc(c.casa)}</b></td><td>${esc(c.propietario)}</td><td class="r">${money(ct.cargos)}</td><td class="r">${money(ct.pagos)}</td><td class="r ${ct.saldo>0.004?"red":"green"}"><b>${money(ct.saldo)}</b></td><td class="acts">${!can.p()||String(c.casa)===String(ME.casa)?`<button class="btn sm" onclick="verEstadoCasa('${esc(c.casa)}')">Ver estado</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="6" class="empty">Registra las casas en "Casas y cuotas"</td></tr>`}</table></div></div>`:""}`};

async function compressImg(file){if(!/^image\//.test(file.type))throw new Error("Solo se permiten fotos.");
  const url=URL.createObjectURL(file);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("No se pudo leer la foto "+file.name));i.src=url});
    const s=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.8));return new File([blob],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"})}
  catch(e){if(file.size<9e6)return file;throw e}finally{URL.revokeObjectURL(url)}}

    <div style="text-align:right;margin-top:8px" class="muted">Total pagado: <b>${money(L.filter(g=>g.anulado!=="Sí").reduce((s,g)=>s+n(g.total),0))}</b></div>`}
  else{const[tp]=EVT[tab];const L=DB.EmpEventos.filter(x=>x.empleado_id===id&&x.tipo===tp).sort((a,b)=>b.fecha.localeCompare(a.fecha));

    ${L.map(x=>`<tr><td>${fd(x.fecha)}</td>${tab==="vac"?`<td>${fd(x.fecha_fin)}</td><td>${esc(x.dias)}</td>`:tab==="amo"?`<td>${esc(x.dias)}</td>`:""}<td>${esc(x.detalle)}</td><td class="acts">${x.adjunto?`<button class="btn sm" onclick="openAdj('${esc(x.adjunto)}')">Abrir</button> `:""}${can.a()?`<button class="btn sm bad" onclick="delEvt('${x.id}','${id}','${tab}')">×</button>`:""}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Sin registros</td></tr>`}</table>
    ${can.w()?`<div class="sec">Agregar ${tp.toLowerCase()}</div><div class="fg">${F(tab==="vac"?"Desde":"Fecha","v_f",today(),"date")}${tab==="vac"?F("Hasta","v_h",today(),"date")+F("Días","v_d","1","number"):""}${tab==="amo"?FS("Tipo","v_t",["Verbal","Escrita","Suspensión"]):""}${F(tab==="doc"?"Nombre del documento":"Detalle / motivo","v_x","","text","","w2")}<div class="f w2"><label>Archivo (opcional)</label><input type="file" id="v_file"></div></div><button class="btn pri" id="v_add">Agregar</button>`:""}`}
  openModal(e.nombre,`<div class="tabs">${tabs.map(([k,t])=>`<button class="${k===tab?"on":""}" onclick="fichaEmp('${id}','${k}')">${t}</button>`).join("")}</div>${body}`,
    `${can.w()?`<button class="btn" onclick="formEmp('${id}')">Editar datos</button><button class="btn pri" onclick="formNomina('${id}')">Registrar pago</button>`:""}`,true);
  if($("v_h")){const dd=()=>{const a=new Date(V("v_f")),b=new Date(V("v_h"));const d=Math.round((b-a)/864e5)+1;if(d>0)$("v_d").value=d};$("v_f").onchange=dd;$("v_h").onchange=dd}
  if($("v_add"))$("v_add").onclick=()=>wrap(async()=>{if(!V("v_x")&&tab!=="vac")throw new Error("Escribe el detalle");
    let adj="";const fl=$("v_file").files[0];if(fl){toast("Subiendo archivo…");adj=await uploadFile(fl)}
    await save("EmpEventos",{empleado_id:id,tipo:EVT[tab][0],fecha:V("v_f"),fecha_fin:V("v_h"),dias:tab==="vac"?V("v_d"):tab==="amo"?V("v_t"):"",detalle:V("v_x"),adjunto:adj});toast("Agregado");fichaEmp(id,tab)})}

const TIPOS_C=["Recordatorio de pago","Aviso de trabajos en áreas comunes","Aviso de avería","Aviso general","Convocatoria a reunión"];
function tplComm(t,x={}){const c=C();
  if(t==="Aviso de trabajos en áreas comunes")return `Estimados residentes:\n\nLes informamos que el día ${x.fecha?fd(x.fecha):"[fecha]"} se realizarán trabajos de ${x.desc||"[descripción]"} en ${x.area||"[área]"}.\n\nDurante los trabajos el área podría estar restringida. Agradecemos su comprensión y colaboración.\n\nAtentamente,\n${c.cargo||"La Administración"}`;
  if(t==="Aviso de avería")return `Estimados residentes:\n\nLes informamos que se ha presentado una avería en ${x.area||"[área / servicio]"}: ${x.desc||"[descripción]"}.\n\nYa estamos trabajando para resolverla lo antes posible y les mantendremos informados.\n\nAtentamente,\n${c.cargo||"La Administración"}`;
  if(t==="Convocatoria a reunión")return `Estimados propietarios:\n\nPor medio de la presente se les convoca a una reunión de propietarios el día [fecha] a las [hora] en [lugar].\n\nAgenda:\n1. [punto]\n2. [punto]\n3. Asuntos generales\n\nSu asistencia es muy importante.\n\nAtentamente,\n${c.cargo||"La Administración"}`;
  if(t==="Recordatorio de pago")return `Estimados propietarios:\n\nLes recordamos que la cuota de mantenimiento correspondiente a ${fp(thisP()).toLowerCase()} debe ser pagada en los primeros días del mes.\n\nMantener las cuotas al día permite cubrir seguridad, limpieza, mantenimiento y demás servicios del residencial.${c.datos_pago?"\n\nDatos para pago:\n"+c.datos_pago:""}\n\nAtentamente,\n${c.cargo||"La Administración"}`;
  return `Estimados residentes:\n\n[mensaje]\n\nAtentamente,\n${c.cargo||"La Administración"}`}
function tplRecCasa(casa){const c=casaObj(casa)||{casa};const ct=cuenta(casa);const cf=C();
  return `Estimado(a) ${c.propietario||"propietario(a)"}:\n\nLe recordamos que la casa ${casa} presenta un balance pendiente de ${money(ct.saldo)}, correspondiente a:\n\n${ct.pend.map(p=>`• ${fp(p.periodo)} · ${p.concepto}: ${money(p.pend)}`).join("\n")}\n\nLe agradecemos realizar el pago a la mayor brevedad posible. Si ya realizó el pago, favor enviarnos el comprobante para actualizar su cuenta.${cf.datos_pago?"\n\nDatos para pago:\n"+cf.datos_pago:""}\n\nAtentamente,\n${cf.cargo||"La Administración"}`}
R.comms=()=>{const L=DB.Comunicaciones.slice().sort((a,b)=>(b.fecha+b.ts).localeCompare(a.fecha+a.ts));
  return `<div class="bar">${can.w()?`<button class="btn pri" onclick="formComm()">+ Nueva comunicación</button><button class="btn dark" onclick="recordatorioGeneral()">Recordatorio general de pago</button><button class="btn" onclick="pickCasaRec()">Recordatorio por casa</button>`:""}</div>
  <div class="card"><div class="tw"><table class="l"><tr><th>No.</th><th>Fecha</th><th>Tipo</th><th>Para</th><th>Asunto</th><th></th></tr>
  ${L.map(m=>`<tr><td><b>${esc(m.no)}</b></td><td>${fd(m.fecha)}</td><td>${esc(m.tipo)}</td><td>${esc(m.destino)}</td><td>${esc(m.asunto)}</td><td class="acts"><button class="btn sm" onclick="verComm('${m.id}')">Ver / PDF</button>${can.a()?` <button class="btn sm bad" onclick="delComm('${m.id}')">×</button>`:""}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">Sin comunicaciones</td></tr>`}</table></div></div>`};

function verComm(id){const m=DB.Comunicaciones.find(x=>x.id===id);const c=m.destino.startsWith("Casa ")?casaObj(m.destino.slice(5)):null;
  const txt=`*${C().nombre}*\n*${m.asunto}*\n\n${m.cuerpo}`;
  showDoc(m.no,docComm(m),`${m.no}_${m.tipo}`,`<a class="btn wa" target="_blank" href="${c&&c.telefono?waLink(c.telefono,txt):"https://wa.me/?text="+encodeURIComponent(txt)}">WhatsApp</a>${c&&c.email?`<a class="btn" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(m.asunto)}&body=${encodeURIComponent(m.cuerpo)}">Correo</a>`:""}`)}

  $("o_t").onchange=()=>{if(confirmBox("¿Reemplazar el mensaje con la plantilla de este tipo?")){$("o_c").value=V("o_d").startsWith("Casa ")&&V("o_t")==="Recordatorio de pago"?tplRecCasa(V("o_d").slice(5)):tplComm(V("o_t"));$("o_a").value=V("o_t")}};

function recordatorioGeneral(){
  const mor=DB.Casas.map(c=>({c,ct:cuenta(c.casa)})).filter(x=>x.ct.saldo>0.004);
  openModal("Recordatorio general de pago",`<div class="info">Opción 1: un aviso general para todas las casas (para grupo de WhatsApp o circular).<br>Opción 2: un recordatorio individual para cada casa con saldo (${mor.length}), con su detalle de deuda.</div>
   <div class="tw"><table class="l"><tr><th></th><th>Casa</th><th>Propietario</th><th class="r">Saldo</th><th></th></tr>${mor.map(x=>`<tr><td><input type="checkbox" class="rg" value="${esc(x.c.casa)}" checked></td><td><b>${esc(x.c.casa)}</b></td><td>${esc(x.c.propietario)}</td><td class="r red">${money(x.ct.saldo)}</td>
   <td class="acts">${x.c.telefono?`<a class="btn sm wa" target="_blank" href="${waLink(x.c.telefono,`*${C().nombre}*\n`+tplRecCasa(x.c.casa))}">WhatsApp</a>`:`<span class="muted" style="font-size:11px">sin teléfono</span>`}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Ninguna casa tiene saldo pendiente</td></tr>`}</table></div>`,
  `<button class="btn" id="rg_gen">Aviso general (todas)</button><button class="btn dark" id="rg_pdf" ${mor.length?"":"disabled"}>PDF individuales (una página por casa)</button>`,true);
  $("rg_gen").onclick=()=>{closeModal();formComm(null,{tipo:"Recordatorio de pago",destino:"Todas las casas",asunto:"Recordatorio de pago de cuota de mantenimiento"})};

/* parse */
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function pDate(s){s=String(s||"").trim();let m;if(!s)return"";if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){let y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}return ""}
function pPer(s){s=String(s||"").trim();let m;if(!s)return"";if(m=s.match(/^(\d{4})-(\d{1,2})/))return `${m[1]}-${m[2].padStart(2,"0")}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{4})$/))return `${m[2]}-${m[1].padStart(2,"0")}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))return pDate(s).slice(0,7);
  const t=norm(s);const i=MES.findIndex((x,k)=>t.startsWith(norm(x))||t.startsWith(norm(MESL[k])));const y=s.match(/(\d{4})/);if(i>-1&&y)return `${y[1]}-${String(i+1).padStart(2,"0")}`;return ""}
function parseImport(type,text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)throw new Error("Pega la fila de títulos y al menos una fila de datos.");
  const sep=lines[0].includes("\t")?"\t":lines[0].includes(";")?";":",";
  const H=lines[0].split(sep).map(norm);
  const alias={casa:["casa","unidad","casano","nocasa","numero casa"],propietario:["propietario","nombre","dueno","cliente","pagador"],telefono:["telefono","tel","celular","whatsapp"],email:["email","correo"],cuota:["cuota","cuotamensual","mantenimiento"],
    periodo:["periodo","mes"],concepto:["concepto","descripcion","detalle"],monto:["monto","valor","importe","total","pago"],fecha:["fecha","fechapago"],forma:["forma","formapago","metodo"],banco:["banco"],referencia:["referencia","ref"],numero:["numero","recibo","norecibo","no"],
    beneficiario:["beneficiario","proveedor","pagadoa"],categoria:["categoria","tipo"],descripcion:["descripcion","concepto","detalle"],estado:["estado"],notas:["notas","nota"]};
  const col=k=>{const al=(alias[k]||[k]).map(norm);return H.findIndex(h=>al.includes(h))};
  const get=(cells,k)=>{const i=col(k);return i>-1?String(cells[i]??"").trim():""};
  const out=[];
  lines.slice(1).forEach((l,ix)=>{const c=l.split(sep);
    if(type==="Casas"){const casa=get(c,"casa");if(!casa)return;out.push({row:{casa,propietario:get(c,"propietario"),telefono:get(c,"telefono"),email:get(c,"email"),cuota:n(get(c,"cuota"))||C().cuota,estado:get(c,"estado")||"Activa",notas:get(c,"notas")},view:{casa,propietario:get(c,"propietario"),cuota:get(c,"cuota")}})}
    if(type==="Cargos"){const casa=get(c,"casa"),p=pPer(get(c,"periodo"))||pDate(get(c,"fecha")).slice(0,7),m=n(get(c,"monto"));if(!casa||!p||!m)throw new Error(`Fila ${ix+2}: falta casa, período o monto`);
      out.push({row:{casa,periodo:p,fecha:pDate(get(c,"fecha"))||p+"-01",concepto:get(c,"concepto")||"Cuota de mantenimiento",monto:m},view:{casa,periodo:fp(p),concepto:get(c,"concepto")||"Cuota de mantenimiento",monto:money(m)}})}
    if(type==="Pagos"){const casa=get(c,"casa"),f=pDate(get(c,"fecha")),m=n(get(c,"monto"));if(!f||!m)throw new Error(`Fila ${ix+2}: falta fecha o monto`);
      const p=pPer(get(c,"periodo"));const con=get(c,"concepto")||"Cuota de mantenimiento";const co=casaObj(casa)||{};
      out.push({row:{no:get(c,"numero"),fecha:f,fpago:f,casa,propietario:get(c,"propietario")||co.propietario||"",descripcion:con,moneda:CUR(),total:m,lineas:[{c:con,p,m,a:NOACCT.includes(con)?0:1}],forma:get(c,"forma")||"Transferencia",banco:get(c,"banco"),referencia:get(c,"referencia"),origen:"Histórico",anulado:""},view:{fecha:fd(f),casa,concepto:con,periodo:fp(p),monto:money(m)}})}
    if(type==="Gastos"){const f=pDate(get(c,"fecha")),m=n(get(c,"monto"));if(!f||!m)throw new Error(`Fila ${ix+2}: falta fecha o monto`);
      out.push({row:{no:get(c,"numero"),tipo:"Pago",fecha:f,beneficiario:get(c,"beneficiario"),categoria:get(c,"categoria"),descripcion:get(c,"descripcion"),subtotal:m,itbis:0,total:m,forma:get(c,"forma")||"Transferencia",referencia:get(c,"referencia"),anulado:""},view:{fecha:fd(f),beneficiario:get(c,"beneficiario"),categoria:get(c,"categoria"),monto:money(m)}})}
  });
  if(!out.length)throw new Error("No se encontraron filas válidas. Revisa los títulos de las columnas.");
  return out}

/* =========================================================
   SESIÓN
   ========================================================= */
function showApp(){$("login").hidden=true;$("app").hidden=false;$("meName").textContent=ME.nombre;$("meRol").textContent=(ROL_TXT[ME.rol]||ME.rol)+(ME.casa?" · casa "+ME.casa:"");drawNav()}
async function enter(){const r=await api("login");ME=r.user;LS.set("lr_me",ME);showApp();
  const cache=LS.get("lr_cache",null);if(cache&&cache._u===ME.id){DB=cache;normalize();render();$("sync").textContent="Actualizando…"}else $("view").innerHTML=`<div class="empty">Cargando datos…</div>`;
  await loadAll();if(DB){DB._u=ME.id;LS.set("lr_cache",DB)}}
async function doLogin(){const u=V("l_user"),pw=$("l_pin").value;if(!u||!pw){$("l_msg").textContent="Escribe usuario y clave.";return}
  $("l_msg").textContent="";busy(true);
  try{const {error}=await sb.auth.signInWithPassword({email:toEmail(u),password:pw});if(error)throw error;LS.set("lr_lastuser",u);await enter()}
  catch(e){await sb.auth.signOut().catch(()=>{});$("l_msg").textContent=trErr(e)}finally{busy(false)}}
async function doBoot(){const nom=V("b_nom"),u=V("b_user"),pw=$("b_pw").value;
  if(!nom||!u)return $("l_msg").textContent="Completa nombre y usuario.";if(pw.length<6)return $("l_msg").textContent="La clave debe tener al menos 6 caracteres.";if(pw!==$("b_pw2").value)return $("l_msg").textContent="Las claves no coinciden.";
  try{busy(true);await invokeFn({action:"bootstrap",nombre:nom,usuario:u,clave:pw});const {error}=await sb.auth.signInWithPassword({email:toEmail(u),password:pw});if(error)throw error;await enter()}
  catch(e){$("l_msg").textContent=trErr(e)}finally{busy(false)}}
$("l_go").onclick=doLogin;$("l_pin").onkeydown=e=>{if(e.key==="Enter")doLogin()};$("b_go").onclick=doBoot;
$("logout").onclick=async e=>{e.preventDefault();await sb.auth.signOut().catch(()=>{});LS.del("lr_cache");LS.del("lr_me");location.reload()};
$("reload").onclick=()=>loadAll();
(async function init(){
  $("l_user").value=LS.get("lr_lastuser","")||"";
  window.addEventListener("resize",()=>{if(!$("modal").hidden&&$("pvs")){const w=$("pvw").clientWidth-24,s=Math.min(1,w/816);$("pvs").style.transform=`scale(${s})`}});
  const {data:{session}}=await sb.auth.getSession();
  if(session){const me=LS.get("lr_me",null);const cache=LS.get("lr_cache",null);
    if(me&&cache&&cache._u===me.id){ME=me;DB=cache;normalize();showApp();render();$("sync").textContent="Actualizando…"}
    try{await enter()}catch(e){if(/Sesión|perfil|desactivado/.test(e.message)){await sb.auth.signOut().catch(()=>{});LS.del("lr_me");location.reload()}else{toast(e.message,1);$("sync").textContent="Sin conexión: mostrando datos guardados"}}
    return}
  try{const r=await invokeFn({action:"estado"});if(r&&r.inicial){$("loginF").hidden=true;$("bootF").hidden=false}}catch(e){}
})();
</script>
